services:
  pan:
    build:
      context: ./pan
      labels:
        org.opencontainers.image.source: https://github.com/dandan658/film-index-hub
        org.opencontainers.image.version: "2.0.0"
        org.opencontainers.image.revision: ${BUILD_REVISION:-local}
  media:
    build:
      context: ./media
      labels:
        org.opencontainers.image.source: https://github.com/dandan658/film-index-hub
        org.opencontainers.image.version: "2.0.0"
        org.opencontainers.image.revision: ${BUILD_REVISION:-local}
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/dandan658/film-index-hub
        org.opencontainers.image.version: "2.0.0"
        org.opencontainers.image.revision: ${BUILD_REVISION:-local}
