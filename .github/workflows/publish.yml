name: Build and verify the single Film Index application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: unified-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package complete source and build one image from Python
        run: |
          python3 scripts/source_bundle.py
          docker build --label org.opencontainers.image.revision=${{ github.sha }} -t ghcr.io/dandan658/film-index-hub:latest .
      - name: Test retained subscription behavior and original accounts
        run: docker run --rm --entrypoint python -v "${{ github.workspace }}/tests:/tests:ro" ghcr.io/dandan658/film-index-hub:latest -m unittest discover -s /tests/subscriptions -v
      - name: Test complete backup and startup restore
        run: docker run --rm --entrypoint python -v "${{ github.workspace }}/tests:/tests:ro" ghcr.io/dandan658/film-index-hub:latest -m unittest discover -s /tests -p test_backup.py -v
      - name: Test real media identification and destination pipeline
        run: docker run --rm --entrypoint python -v "${{ github.workspace }}/scripts/test_media_runtime.py:/tests/test_media_runtime.py:ro" ghcr.io/dandan658/film-index-hub:latest /tests/test_media_runtime.py
      - name: Test bundled FFmpeg thumbnail generation
        run: docker run --rm --entrypoint python -v "${{ github.workspace }}/scripts/test_thumbnails.py:/tests/test_thumbnails.py:ro" ghcr.io/dandan658/film-index-hub:latest /tests/test_thumbnails.py
      - name: Test legacy data migration, one process and single-session access
        run: bash scripts/smoke-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: single-application-evidence
          path: |
            /tmp/film-index-resources.txt
            /tmp/film-index-processes.txt
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the single verified image
        run: |
          docker tag ghcr.io/dandan658/film-index-hub:latest ghcr.io/dandan658/film-index-hub:3.0.10
          docker push ghcr.io/dandan658/film-index-hub:3.0.10
          docker push ghcr.io/dandan658/film-index-hub:latest
