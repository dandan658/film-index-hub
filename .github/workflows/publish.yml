name: Build and test integrated Film Index Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: hub-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test shared login and media guard
        run: |
          python3 -m pip install Flask==2.1.2 Werkzeug==2.1.2 Flask-Login==0.6.3
          python3 -m unittest discover -s tests -v
          cd media
          python3 -m unittest discover -s tests -p test_media_profile.py -v
          python3 -m unittest discover -s tests -p test_directory_listing.py -v
      - name: Package public source and build all services
        run: |
          python3 scripts/source_bundle.py
          docker compose -f compose.yaml -f compose.build.yaml build
      - name: Test Baidu task and authentication regressions
        run: docker run --rm --entrypoint python -v "${{ github.workspace }}/pan/tests:/tests:ro" ghcr.io/dandan658/film-index-hub-pan:latest -m unittest discover -s /tests -v
      - name: Test original accounts, one login, media pages, session persistence and idle resources
        run: bash scripts/smoke-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-evidence
          path: |
            /tmp/film-hub-resources.txt
            /tmp/film-hub-media-processes.txt
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the verified stack
        run: |
          set -euo pipefail
          for image in film-index-hub film-index-hub-pan film-index-hub-media; do
            docker tag "ghcr.io/dandan658/$image:latest" "ghcr.io/dandan658/$image:2.0.0"
            docker push "ghcr.io/dandan658/$image:2.0.0"
            docker push "ghcr.io/dandan658/$image:latest"
          done
