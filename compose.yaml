services:
  film-index:
    image: ghcr.io/dandan658/film-index-hub:latest
    pull_policy: always
    container_name: film-index
    restart: unless-stopped
    ports:
      - "18520:5000"
    environment:
      TZ: Asia/Shanghai
      FILM_INDEX_DATA: /data
      WEB_THREADS: "8"
    volumes:
      - ./data:/data
      # Point these to the existing directories to retain accounts, tasks and media data.
      - ${PAN_CONFIG_DIR:-./data/config}:/data/config
      - ${PAN_LOG_DIR:-./data/log}:/data/log
      - ${MEDIA_CONFIG_DIR:-./data/media}:/data/media
      - ${MEDIA_ROOT:-./media}:/media
    mem_limit: ${FILM_MEMORY:-512m}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

